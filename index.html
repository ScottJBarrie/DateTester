<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Almanac">
<meta name="theme-color" content="#16182B">
<title>Almanac</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --midnight:#16182B;
    --slate:#232743;
    --bone:#F2EDE4;
    --brass:#C9A227;
    --verdigris:#4FB49A;
    --rust:#C05A4A;
    --hairline:rgba(242,237,228,.14);
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

  html,body{height:100%}

  body{
    background:var(--midnight);
    color:var(--bone);
    font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    display:flex;
    justify-content:center;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
  }

  .app{
    width:100%;
    max-width:480px;
    height:100dvh;
    display:flex;
    flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 18px);
    gap:14px;
  }

  .masthead{display:flex;align-items:baseline;justify-content:space-between}
  .wordmark{font-size:.7rem;letter-spacing:.42em;text-transform:uppercase;color:var(--brass);font-weight:600}
  .tagline{font-size:.68rem;letter-spacing:.06em;opacity:.45}

  .reference-link{
    background:none;border:0;font-family:inherit;cursor:pointer;
    color:var(--brass);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;
    font-weight:600;padding:2px 0;border-bottom:1px solid rgba(201,162,39,.4);
  }
  .reference-link:focus-visible{outline:2px solid var(--brass);outline-offset:3px}

  .modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .modes button{
    font-family:inherit;font-size:.66rem;font-weight:600;letter-spacing:.18em;
    text-transform:uppercase;color:var(--bone);background:var(--slate);
    border:1px solid transparent;border-radius:9px;padding:11px 6px;cursor:pointer;
    opacity:.45;transition:opacity .12s ease,color .12s ease;
  }
  .modes button.on{opacity:1;border-color:var(--brass);color:var(--brass)}
  .modes button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

  .scores{display:flex;border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline)}
  .score{flex:1;padding:9px 0;text-align:center;border-right:1px solid var(--hairline)}
  .score:last-child{border-right:0}
  .score b{display:block;font-size:1.05rem;font-weight:500;font-variant-numeric:tabular-nums}
  .score span{display:block;font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;opacity:.45;margin-top:2px}

  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0}
  .date{
    font-family:"Fraunces","Georgia",serif;font-weight:300;
    font-size:clamp(2.1rem,10.5vw,3.3rem);line-height:1.16;letter-spacing:-.01em;
  }
  .date .day-num{font-weight:600}
  .date .suffix{font-size:.46em;vertical-align:.72em;color:var(--brass);font-weight:600;margin-left:.02em}
  .date .of{display:block;font-size:.38em;letter-spacing:.3em;text-transform:uppercase;opacity:.4;
    font-family:"IBM Plex Sans",sans-serif;margin:.5em 0 .35em}

  .verdict{margin-top:22px;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .verdict .answer{
    font-family:"Fraunces",Georgia,serif;font-size:1.6rem;font-weight:600;letter-spacing:.02em;
    opacity:0;transform:translateY(6px);transition:opacity .18s ease,transform .18s ease;
  }
  .verdict .note{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;opacity:.45}
  .verdict.show .answer{opacity:1;transform:none}
  .verdict.right .answer{color:var(--verdigris)}
  .verdict.wrong .answer{color:var(--rust)}

  .working-link{
    display:none;background:none;border:0;font-family:inherit;cursor:pointer;
    color:var(--brass);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;
    font-weight:600;padding:8px 4px;margin-top:2px;
    border-bottom:1px solid rgba(201,162,39,.4);
  }
  .working-link.show{display:block}

  .quiz-card{
    display:none;width:72px;height:108px;border-radius:8px;object-fit:cover;
    border:1px solid rgba(201,162,39,.45);margin-top:6px;
  }
  .quiz-card.show{display:block}

  .days{display:none;grid-template-columns:1fr 1fr;gap:8px}
  .days.show{display:grid}
  .days button{
    font-family:inherit;font-size:.96rem;font-weight:500;color:var(--bone);
    background:var(--slate);border:1px solid transparent;border-radius:11px;
    padding:15px 6px;cursor:pointer;
    transition:background .12s ease,color .12s ease;
  }
  .days button:nth-child(7){grid-column:span 2}
  .days button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  .days button:active{background:#2b3053}
  .days button.correct{background:var(--verdigris);color:var(--midnight);font-weight:600}
  .days button.incorrect{background:var(--rust);color:var(--bone)}

  .codes{display:none;grid-template-columns:repeat(12,1fr);gap:8px}
  .codes.show{display:grid}
  .codes button{
    font-family:"Fraunces",Georgia,serif;font-size:1.35rem;font-weight:600;color:var(--bone);
    background:var(--slate);border:1px solid transparent;border-radius:11px;
    padding:14px 0;cursor:pointer;grid-column:span 3;
    transition:background .12s ease,color .12s ease;
  }
  .codes button:nth-child(n+5){grid-column:span 4}
  .codes button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  .codes button:active{background:#2b3053}
  .codes button.correct{background:var(--verdigris);color:var(--midnight)}
  .codes button.incorrect{background:var(--rust);color:var(--bone)}

  .next{
    display:none;width:100%;font-family:inherit;font-size:.78rem;font-weight:600;
    letter-spacing:.18em;text-transform:uppercase;
    background:transparent;color:var(--brass);border:1px solid var(--brass);
    border-radius:11px;padding:14px;cursor:pointer;
  }
  .next.show{display:block}
  .next:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

  /* working sheet */
  .sheet{
    position:fixed;inset:0;background:var(--midnight);z-index:10;
    display:none;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 22px) 20px calc(env(safe-area-inset-bottom) + 18px);
  }
  .sheet.show{display:flex}
  .sheet-inner{width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;height:100%}
  .sheet h2{
    font-family:"Fraunces",Georgia,serif;font-weight:300;font-size:1.5rem;
    text-align:center;margin-bottom:4px;
  }
  .sheet .sub{
    text-align:center;font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;
    color:var(--brass);margin-bottom:18px;
  }
  .steps{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .steps .group{
    font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;
    color:var(--brass);padding:20px 0 7px;border-bottom:1px solid var(--hairline);
  }
  .steps .group:first-child{padding-top:0}
  .step{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--hairline);align-items:flex-start}
  .step .code{
    font-family:"Fraunces",Georgia,serif;font-size:1.5rem;font-weight:600;
    min-width:38px;text-align:center;color:var(--brass);line-height:1.1;
  }
  .step .body{flex:1}
  .step .head{font-size:.94rem;font-weight:500}
  .step .hint{font-size:.78rem;opacity:.55;margin-top:3px;line-height:1.45}
  .step .portrait{
    width:88px;height:132px;flex:none;border-radius:10px;object-fit:cover;
    background:var(--slate);border:1px solid rgba(201,162,39,.45);
    opacity:0;transition:opacity .2s ease;
  }
  .step .portrait.loaded{opacity:1}
  .step.total{border-bottom:0;padding-top:16px}
  .step.total .code{color:var(--verdigris)}
  .step.total .head{font-size:1rem;font-weight:600}
  .sheet .close{
    margin-top:14px;width:100%;font-family:inherit;font-size:.78rem;font-weight:600;
    letter-spacing:.18em;text-transform:uppercase;background:var(--slate);color:var(--bone);
    border:0;border-radius:11px;padding:15px;cursor:pointer;
  }
  .sheet .close:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="app">

  <header class="masthead">
    <span class="wordmark">Almanac</span>
    <button type="button" class="reference-link" id="referenceLink">The codes</button>
  </header>

  <nav class="modes" id="modes">
    <button type="button" data-mode="dates">Dates</button>
    <button type="button" data-mode="codes">Codes</button>
  </nav>

  <section class="scores">
    <div class="score"><b id="streak">0</b><span>Streak</span></div>
    <div class="score"><b id="tally">0/0</b><span>Correct</span></div>
    <div class="score"><b id="clock">0.0s</b><span>Time</span></div>
  </section>

  <main class="stage">
    <p class="date" id="date"></p>
    <div class="verdict" id="verdict">
      <span class="answer" id="answer"></span>
      <span class="note" id="note">Which day was it?</span>
      <img class="quiz-card" id="quizCard" alt="">
      <button class="working-link" id="workingLink">Show working</button>
    </div>
  </main>

  <div class="days" id="days"></div>
  <div class="codes" id="codes"></div>
  <button class="next" id="next">Next date</button>

</div>

<div class="sheet" id="sheet">
  <div class="sheet-inner">
    <h2 id="sheetDate"></h2>
    <p class="sub" id="sheetDay"></p>
    <div class="steps" id="steps"></div>
    <button class="close" id="close">Back to the date</button>
  </div>
</div>

<script>
/* ============================================================
   YOUR PALACE
   Edit the text inside the quote marks only.
   Leave the numbers and the punctuation alone.
   ============================================================ */

/* The seven areas, one for each year code. */
const ROOMS = {
  0: { room: 'The Garden',            shape: 'Football' },
  1: { room: "Scott's Bedroom",       shape: 'Golf pin with a flag on it' },
  2: { room: "Mam and Dad's Bedroom", shape: 'Ice sculpture of a swan' },
  3: { room: 'The Study',             shape: 'Huge comedy moustache on the door' },
  4: { room: 'The Hall and Stairs',   shape: 'Sailboat ornament' },
  5: { room: 'The Kitchen',           shape: 'Hooks' },
  6: { room: 'The Living and Dining Room', shape: 'Golf club' }
};

/* The people, by two digit year. Add them as you go.
   Keep the quote marks around the number, so '06' and not 6. */
const PEOPLE = {
  /* 0, The Garden */
  '00': 'Ozzy Osborne',
  '06': 'OJ Simpson',
  '17': 'Al Gore',
  '23': 'Billy Connelly',
  '28': 'Benny Hill',
  '34': 'Charles Darwin',
  '45': 'Dick Emery',
  '51': 'Edgar Alan Poe',
  '56': 'Edwin Starr',
  '62': 'Sara Bareilles',
  '73': 'Gary Coleman',
  '79': 'Gary Newman',
  '84': 'Hugh Dennis',
  '90': 'Nero',                 /* NerO, first and last letter */

  /* 1, Scott's Bedroom */
  '01': 'Olly Alcock',
  '07': 'Olly Green',
  '12': 'Alice Bondi',
  '18': 'Adolf Hitler',
  '29': 'Bill Nighy',
  '35': 'Clint Eastwood',
  '40': 'Donny Osmond',
  '46': 'Dan Sylvester',
  '57': 'Ed Gein',
  '63': 'Sean Connery',
  '68': 'Stephen Hawkins',
  '74': 'Gary Davis',
  '85': 'Harry Enfield',
  '91': 'Neil Armstrong',
  '96': 'Nicole Scherzinger',

  /* 2, Mam and Dad's Bedroom */
  '02': 'Orlando Bloom',
  '13': 'Al Capone',
  '19': 'Admiral Nelson',
  '24': 'Bruce Dickinson',
  '30': 'Clive Owen',
  '41': 'Dan Akroyd',
  '47': 'Danny Glover',
  '52': 'Eva Braun',
  '58': 'Ethan Hawke',
  '69': 'Sam Neil',
  '75': 'Gloria Estefan',
  '80': 'Hall and Oates',
  '86': 'Horace Skiing',
  '97': 'Noel Gallagher',

  /* 3, The Study */
  '03': 'Oliver Cromwell',
  '08': 'Oliver Hardy',
  '14': 'Admiral Donitz',
  '25': 'Billy Elliot',
  '31': 'Chris Angel',
  '36': 'Charlie Sheen',
  '42': 'Derren Brown',
  '53': 'Eric Clapton',
  '59': 'Ed Norton',
  '64': 'Simon Doyle',
  '70': 'Gary Oldman',
  '81': 'Hank Azaria',
  '87': 'Harry Green',
  '92': 'Napoleon Bonaparte',
  '98': 'Nick Hewer',

  /* 4, The Hall and Stairs */
  '09': 'Oliver North',
  '15': 'Albert Einstein',
  '20': 'Barrack Obama',
  '26': 'Bart Simpson',
  '37': 'Clark Gable',
  '43': 'Darren Coulson',
  '48': 'Dustin Hoffman',
  '54': 'Ethan Doyle',
  '65': 'Sophie Ellis Bextor',
  '71': 'Gillian Anderson',
  '76': 'Gene Simmons',
  '82': 'Halle Berry',
  '93': 'Nicholas Cage',
  '99': 'Ned Nedderlander',

  /* 5, The Kitchen */
  '04': 'Omid Djalili',
  '10': 'Asterix and Obelix',
  '21': 'B A Barrackas',
  '27': 'Bill Gates',
  '32': 'Christian Bale',
  '38': 'Christopher Hitchens',
  '49': 'David Niven',
  '55': 'Eddie the Eagle Edwards',
  '60': 'Sharon Osborne',
  '66': 'Sly Stallone',
  '77': 'Gina Green',
  '83': 'Howard Carter',
  '88': 'Hulk Hogan',
  '94': 'Neil Diamond',

  /* 6, The Living and Dining Room */
  '05': 'Freddie Kruger',       /* On Elm, as in Nightmare on Elm Street */
  '11': 'Alan Ackerman',
  '16': 'Arnold Schwarzenegger',
  '22': 'Bobby Ball',
  '33': 'Charlie Chaplain',
  '39': 'Chuck Norris',
  '44': 'Dan Dare',
  '50': "Ed O'Neil",
  '61': 'Steve Austin',
  '67': 'Sarah Michelle Gellar',
  '72': 'George Bush',
  '78': 'Gerri Halliwell',
  '89': 'Hiro Nakamura',
  '95': 'Noel Edmonds'
};

/* Month prompts. These are placeholders, swap them for your own. */
const MONTH_HINTS = [
  'January, the first month',
  'February, four beats in the word',
  'March, in four four time',
  'April Fool, you get a duck, zero',
  'Mayday, mayday, always said twice',
  'June, halfway through, hand up for five',
  'July, the sun is a big zero in the sky',
  'August, the third month of summer',
  'September, sept is seven, one less is six',
  'Octoberfest, Fest is like First',
  'November, the night before Bonfire Night',
  'December, the sixth is St Nicholas Day'
];

/* ============================================================
   Below here is the machinery. No need to touch it.
   ============================================================ */
(function(){
  const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const MONTH_CODES = [1,4,4,0,2,5,0,3,6,1,4,6];
  function yearCode(yy){ return (yy + Math.floor(yy / 4)) % 7; }
  const MIN = Date.UTC(1900,0,1);
  const MAX = Date.UTC(2099,11,31);

  const el = {
    date: document.getElementById('date'),
    verdict: document.getElementById('verdict'),
    answer: document.getElementById('answer'),
    note: document.getElementById('note'),
    days: document.getElementById('days'),
    codes: document.getElementById('codes'),
    modes: document.getElementById('modes'),
    quizCard: document.getElementById('quizCard'),
    referenceLink: document.getElementById('referenceLink'),
    next: document.getElementById('next'),
    streak: document.getElementById('streak'),
    tally: document.getElementById('tally'),
    clock: document.getElementById('clock'),
    workingLink: document.getElementById('workingLink'),
    sheet: document.getElementById('sheet'),
    sheetDate: document.getElementById('sheetDate'),
    sheetDay: document.getElementById('sheetDay'),
    steps: document.getElementById('steps'),
    close: document.getElementById('close')
  };

  let current = null, locked = false, started = 0, ticker = null, advance = null;
  let streak = 0, correct = 0, total = 0;
  let mode = 'dates', quiz = null;

  const buttons = DAYS.map(function(name, i){
    const b = document.createElement('button');
    b.textContent = name;
    b.addEventListener('click', function(){ answer(i, b); });
    el.days.appendChild(b);
    return b;
  });

  const codeButtons = [0,1,2,3,4,5,6].map(function(n){
    const b = document.createElement('button');
    b.textContent = n;
    b.addEventListener('click', function(){ answerCode(n, b); });
    el.codes.appendChild(b);
    return b;
  });

  let audio = null;
  function chime(){
    try{
      if(!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if(audio.state === 'suspended') audio.resume();
      const now = audio.currentTime;
      [[880, 0], [1318.51, 0.1]].forEach(function(note){
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = 'sine';
        osc.frequency.value = note[0];
        gain.gain.setValueAtTime(0.0001, now + note[1]);
        gain.gain.linearRampToValueAtTime(0.25, now + note[1] + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + note[1] + 0.45);
        osc.connect(gain);
        gain.connect(audio.destination);
        osc.start(now + note[1]);
        osc.stop(now + note[1] + 0.5);
      });
    }catch(e){}
  }

  function suffix(n){
    if(n > 3 && n < 21) return 'th';
    const last = n % 10;
    return last === 1 ? 'st' : last === 2 ? 'nd' : last === 3 ? 'rd' : 'th';
  }

  function isLeap(y){ return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }

  function pad(n){ return n < 10 ? '0' + n : '' + n; }

  /* The working, exactly as you calculate it */
  function working(d){
    const day = d.getUTCDate();
    const monthIndex = d.getUTCMonth();
    const year = d.getUTCFullYear();
    const yy = year % 100;

    const dayCode = day % 7;
    const sevens = Math.floor(day / 7);
    const monthCode = MONTH_CODES[monthIndex];
    const yCode = yearCode(yy);
    const centuryCode = year < 2000 ? 0 : 6;
    const leap = isLeap(year) && monthIndex < 2 ? -1 : 0;

    const sum = dayCode + monthCode + yCode + centuryCode + leap;
    const finalCode = ((sum % 7) + 7) % 7;

    return {
      day: day, month: MONTHS[monthIndex], year: year, yy: yy,
      dayCode: dayCode, sevens: sevens,
      monthCode: monthCode, monthHint: MONTH_HINTS[monthIndex],
      yearCode: yCode, centuryCode: centuryCode,
      leap: leap, sum: sum, finalCode: finalCode
    };
  }

  /* Character pictures live in the people folder, named by two digit year,
     for example people/25.png. Either .png or .jpg works, so a new picture
     can just be dropped in as whichever it happens to be. */
  const PICTURE_TYPES = ['png','jpg','jpeg'];

  function setPicture(img, yy, done){
    let attempt = 0;
    img.onload = function(){ if(done) done(true); };
    img.onerror = function(){
      attempt++;
      if(attempt < PICTURE_TYPES.length){
        img.src = 'people/' + pad(yy) + '.' + PICTURE_TYPES[attempt];
      } else {
        img.onerror = null;
        if(done) done(false);
      }
    };
    img.src = 'people/' + pad(yy) + '.' + PICTURE_TYPES[0];
  }

  function addPortrait(step, yy){
    const img = document.createElement('img');
    img.className = 'portrait';
    img.alt = PEOPLE[pad(yy)] || 'Character for ' + pad(yy);
    setPicture(img, yy, function(ok){
      if(ok) img.classList.add('loaded'); else img.remove();
    });
    step.appendChild(img);
  }

  function row(code, head, hint, isTotal, pictureYear){
    const div = document.createElement('div');
    div.className = 'step' + (isTotal ? ' total' : '');
    div.innerHTML =
      '<div class="code">' + code + '</div>' +
      '<div class="body"><div class="head">' + head + '</div>' +
      (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>';
    if(pictureYear !== undefined) addPortrait(div, pictureYear);
    return div;
  }

  function buildSheet(){
    const w = working(current);
    el.sheetDate.textContent = w.day + suffix(w.day) + ' of ' + w.month + ' ' + w.year;
    el.sheetDay.textContent = DAYS[current.getUTCDay()];
    el.steps.innerHTML = '';

    el.steps.appendChild(row(
      w.dayCode, 'The day, ' + w.day,
      w.sevens ? 'Cast out ' + w.sevens + ' seven' + (w.sevens > 1 ? 's' : '') + ', ' + (w.sevens * 7) + ', leaving ' + w.dayCode
               : 'Under seven, so it stands as it is'
    ));

    el.steps.appendChild(row(w.monthCode, w.month, w.monthHint));

    const place = ROOMS[w.yearCode] || {};
    const who = PEOPLE[pad(w.yy)];
    let hint = who ? who + ' is your ' + pad(w.yy) : 'Year ' + pad(w.yy) + ', name not added yet';
    if(place.room){
      hint += '. ' + place.room;
      if(place.shape) hint += ', ' + place.shape.toLowerCase();
      hint += ', which is ' + w.yearCode + '.';
    } else {
      hint += '. Room for ' + w.yearCode + ' not added yet.';
    }
    el.steps.appendChild(row(w.yearCode, 'The year, ' + pad(w.yy), hint, false, w.yy));

    el.steps.appendChild(row(
      w.centuryCode, w.year < 2000 ? 'The 1900s' : 'The 2000s',
      w.year < 2000 ? 'Nothing to add for the last century' : 'Always add 6 for dates from 2000 onwards'
    ));

    if(w.leap){
      el.steps.appendChild(row('-1', 'Leap year',
        w.year + ' divides by 4, and the date falls in January or February, so take 1 off'));
    }

    el.steps.appendChild(row(
      w.finalCode, 'Total ' + w.sum + ', giving ' + w.finalCode,
      (w.sum >= 7 ? 'Cast out the sevens and you are left with ' + w.finalCode + '. ' : '') +
      'Count 0 as Saturday, 1 as Sunday, and on. So ' + w.finalCode + ' is ' + DAYS[current.getUTCDay()] + '.',
      true
    ));
  }

  function groupHeading(text){
    const div = document.createElement('div');
    div.className = 'group';
    div.textContent = text;
    return div;
  }

  function listNames(names){
    if(names.length === 1) return names[0];
    return names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
  }

  /* The reference sheet, every code in one place */
  function buildReference(){
    el.sheetDate.textContent = 'The codes';
    el.sheetDay.textContent = 'Reference';
    el.steps.innerHTML = '';

    const byCode = [[],[],[],[],[],[],[]];
    MONTH_CODES.forEach(function(c, i){ byCode[c].push(i); });

    el.steps.appendChild(groupHeading('Months'));
    byCode.forEach(function(list, c){
      if(!list.length) return;
      el.steps.appendChild(row(
        c,
        listNames(list.map(function(i){ return MONTHS[i]; })),
        list.map(function(i){ return MONTH_HINTS[i]; }).join('. ')
      ));
    });

    el.steps.appendChild(groupHeading('Rooms'));
    for(let c = 0; c < 7; c++){
      const place = ROOMS[c] || {};
      el.steps.appendChild(row(c, place.room || 'Not named yet', place.shape || ''));
    }

    el.steps.appendChild(groupHeading('The rest'));
    el.steps.appendChild(row(0, 'The day of the month', 'Cast out the sevens and keep what is left'));
    el.steps.appendChild(row(0, 'Dates in the 1900s', 'Nothing to add'));
    el.steps.appendChild(row(6, 'Dates from 2000 on', 'Always add 6'));
    el.steps.appendChild(row('-1', 'Leap year, January or February only', 'Take 1 off the total'));
    el.steps.appendChild(row(0, 'Reading the total', 'Cast out the sevens. 0 is Saturday, 1 is Sunday, and on.', true));
  }

  function openReference(){
    clearTimeout(advance);
    buildReference();
    el.close.textContent = 'Back to practice';
    el.sheet.classList.add('show');
    if(locked) el.next.classList.add('show');
  }

  function openSheet(){
    clearTimeout(advance);
    buildSheet();
    el.close.textContent = 'Back to the date';
    el.sheet.classList.add('show');
    el.next.classList.add('show');
  }

  function closeSheet(){ el.sheet.classList.remove('show'); }

  function deal(){
    closeSheet();
    current = new Date(MIN + Math.floor(Math.random() * (MAX - MIN + 1)));
    const d = current.getUTCDate();
    el.date.innerHTML =
      '<span class="day-num">' + d + '</span><span class="suffix">' + suffix(d) + '</span>' +
      '<span class="of">of</span>' +
      MONTHS[current.getUTCMonth()] + ' ' + current.getUTCFullYear();

    locked = false;
    el.next.classList.remove('show');
    el.workingLink.classList.remove('show');
    el.quizCard.classList.remove('show');
    el.verdict.className = 'verdict';
    el.answer.textContent = '';
    el.note.textContent = 'Which day was it?';
    buttons.forEach(function(b){ b.className = ''; b.disabled = false; });

    started = Date.now();
    clearInterval(ticker);
    ticker = setInterval(tick, 100);
    tick();
  }

  function tick(){
    el.clock.textContent = ((Date.now() - started) / 1000).toFixed(1) + 's';
  }

  function answer(index, button){
    if(locked) return;
    locked = true;
    clearInterval(ticker);
    const seconds = ((Date.now() - started) / 1000).toFixed(1);
    const right = current.getUTCDay();
    const won = index === right;

    total++;
    if(won){ correct++; streak++; } else { streak = 0; }
    el.streak.textContent = streak;
    el.tally.textContent = correct + '/' + total;
    el.clock.textContent = seconds + 's';

    buttons.forEach(function(b){ b.disabled = true; });
    buttons[right].classList.add('correct');
    if(!won) button.classList.add('incorrect');

    el.verdict.className = 'verdict show ' + (won ? 'right' : 'wrong');
    el.answer.textContent = DAYS[right];
    el.note.textContent = won ? 'Correct in ' + seconds + 's' : 'Not quite';
    el.workingLink.classList.add('show');

    if(won){
      chime();
      advance = setTimeout(deal, 1800);
    } else {
      el.next.classList.add('show');
    }
  }

  /* Codes practice, one lookup at a time */
  function dealQuiz(){
    closeSheet();
    if(Math.random() < 0.35){
      const m = Math.floor(Math.random() * 12);
      quiz = { kind: 'month', code: MONTH_CODES[m], label: MONTHS[m], hint: MONTH_HINTS[m] };
    } else {
      const n = Math.floor(Math.random() * 100);
      const place = ROOMS[yearCode(n)] || {};
      let hint = PEOPLE[pad(n)] || 'Year ' + pad(n) + ', name not added yet';
      if(place.room){
        hint += ', ' + place.room;
        if(place.shape) hint += ', ' + place.shape.toLowerCase();
      }
      quiz = { kind: 'year', code: yearCode(n), label: pad(n), hint: hint, yy: n };
    }

    el.date.innerHTML = '<span class="day-num">' + quiz.label + '</span>';
    locked = false;
    el.next.classList.remove('show');
    el.workingLink.classList.remove('show');
    el.quizCard.classList.remove('show');
    el.verdict.className = 'verdict';
    el.answer.textContent = '';
    el.note.textContent = quiz.kind === 'month' ? 'Which code is this month?' : 'Which code is this year?';
    codeButtons.forEach(function(b){ b.className = ''; b.disabled = false; });

    started = Date.now();
    clearInterval(ticker);
    ticker = setInterval(tick, 100);
    tick();
  }

  function answerCode(picked, button){
    if(locked) return;
    locked = true;
    clearInterval(ticker);
    const seconds = ((Date.now() - started) / 1000).toFixed(1);
    const won = picked === quiz.code;

    total++;
    if(won){ correct++; streak++; } else { streak = 0; }
    el.streak.textContent = streak;
    el.tally.textContent = correct + '/' + total;
    el.clock.textContent = seconds + 's';

    codeButtons.forEach(function(b){ b.disabled = true; });
    codeButtons[quiz.code].classList.add('correct');
    if(!won) button.classList.add('incorrect');

    el.verdict.className = 'verdict show ' + (won ? 'right' : 'wrong');
    el.answer.textContent = quiz.code;
    el.note.textContent = quiz.hint;

    if(quiz.kind === 'year'){
      el.quizCard.alt = PEOPLE[pad(quiz.yy)] || 'Character for ' + pad(quiz.yy);
      setPicture(el.quizCard, quiz.yy, function(ok){
        el.quizCard.classList.toggle('show', ok);
      });
    }

    if(won){
      chime();
      advance = setTimeout(dealQuiz, quiz.kind === 'year' ? 2200 : 1500);
    } else {
      el.next.classList.add('show');
    }
  }

  function setMode(next){
    mode = next;
    clearTimeout(advance);
    closeSheet();
    Array.prototype.forEach.call(el.modes.children, function(b){
      b.classList.toggle('on', b.dataset.mode === next);
    });
    el.days.classList.toggle('show', next === 'dates');
    el.codes.classList.toggle('show', next === 'codes');
    el.next.textContent = next === 'dates' ? 'Next date' : 'Next question';
    streak = 0; correct = 0; total = 0;
    el.streak.textContent = '0';
    el.tally.textContent = '0/0';
    if(next === 'dates') deal(); else dealQuiz();
  }

  Array.prototype.forEach.call(el.modes.children, function(b){
    b.addEventListener('click', function(){ setMode(b.dataset.mode); });
  });

  el.next.addEventListener('click', function(){
    if(mode === 'dates') deal(); else dealQuiz();
  });
  el.referenceLink.addEventListener('click', openReference);
  el.workingLink.addEventListener('click', openSheet);
  el.close.addEventListener('click', closeSheet);
  setMode('dates');
})();
</script>
</body>
</html>
